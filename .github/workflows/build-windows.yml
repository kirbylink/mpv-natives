name: build-windows

# Builds a single self-contained libmpv-2.dll for Windows (x86_64) from mpv
# source pinned to a release tag. Every dependency is built static and linked
# into the one DLL together with a static CRT, so the artifact has no runtime
# dependency closure to ship (unlike mpv's own shared-DLL CI build).
#
# Pinned to the mpv tag in ci/versions.env - the version whose client API
# (131077) the jlibmpv JNA bindings are validated against. Bump MPV_REF (and
# the dependency pins) there for a libmpv update. The build recipe lives in
# ci/build-libmpv-mingw64.sh.
#
# Triggers: pull requests (PR check), manual workflow_dispatch, and
# workflow_call from release.yml on tag push. A push to main builds nothing.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    # A called (reusable) workflow only exposes top-level `workflow_call`
    # outputs to the caller - job outputs are not. release.yml needs the
    # mpv version to name the release assets, so expose it here.
    outputs:
      version:
        description: mpv version the built artifact was compiled from
        value: ${{ jobs.windows.outputs.version }}

env:
  TARGET: x86_64-w64-mingw32

jobs:
  windows:
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
      version: ${{ steps.artifact.outputs.version }}
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Check out mpv-natives (build scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load pinned versions
        id: versions
        run: |
          source ci/versions.env
          echo "mpv_ref=$MPV_REF" >> "$GITHUB_OUTPUT"

      - name: Check out mpv (pinned tag)
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: ${{ steps.versions.outputs.mpv_ref }}
          path: mpv
          fetch-depth: 1

      - name: Get time
        id: get_time
        run: echo "timestamp=$(date +%s%N)" >> $GITHUB_OUTPUT

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: ${{ env.TARGET }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ccache g++-mingw-w64 gcc-multilib python3-pip nasm ninja-build pkgconf
          python3 -m pip install meson

      # Run the vendored build script from inside the mpv source tree, so the
      # cross-build writes mingw_prefix/ and the meson build next to mpv's
      # meson.build and produces the self-contained DLL in mpv/artifact/.
      - name: Build self-contained libmpv
        working-directory: mpv
        run: bash "${{ github.workspace }}/ci/build-libmpv-mingw64.sh"

      - name: Print meson log on failure
        if: failure()
        run: cat mpv/mingw_build/meson-logs/meson-log.txt

      - name: Collect artifact
        run: |
          mkdir -p artifact-libmpv
          cp -pv mpv/artifact/libmpv-*.dll artifact-libmpv/
          echo "=== contents ==="
          ls -l artifact-libmpv

      - name: Checksums
        run: |
          cd artifact-libmpv
          sha256sum *.dll > checksums.txt
          cat checksums.txt

      - name: Artifact name
        id: artifact
        run: |
          VER=$(cat mpv/MPV_VERSION | tr -d '[:space:]')
          echo "name=mpv-natives-windows-x86_64" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact-libmpv

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}