name: build-macos-arch

# Builds the self-contained libmpv dylib for one macOS architecture
# (x86_64 on macos-14, arm64 on macos-15) using the vendored build script.
# The merge job in build-macos.yml combines the per-architecture dylibs into
# a universal binary.

on:
  workflow_call:
    inputs:
      arch:
        description: Target architecture (x86_64 or arm64)
        required: true
        type: string
      runner:
        description: GitHub runner image providing that architecture
        required: true
        type: string

env:
  MPV_REF: v0.41.0
  ARCH: ${{ inputs.arch }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Check out mpv-natives (build scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out mpv (pinned tag)
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: ${{ env.MPV_REF }}
          path: mpv
          fetch-depth: 1

      - name: Get time
        id: get_time
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-${{ env.ARCH }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: macos-${{ env.ARCH }}-

      - name: Install dependencies
        run: |
          # PEP 668: pip installs are blocked on the macOS runner, use brew.
          brew install ccache nasm ninja meson

      # Run the vendored build script from inside the mpv source tree, so the
      # native build writes macos_prefix/ and the meson build next to mpv's
      # meson.build and produces the self-contained dylib in mpv/artifact/.
      - name: Build self-contained libmpv
        working-directory: mpv
        run: bash "${{ github.workspace }}/ci/build-libmpv-macos.sh"

      - name: Print meson log on failure
        if: failure()
        run: cat mpv/macos_build/meson-logs/meson-log.txt

      - name: Collect artifact
        run: |
          mkdir -p "artifact-macos-${{ env.ARCH }}"
          cp -pv mpv/artifact/libmpv-2.dylib "artifact-macos-${{ env.ARCH }}/"
          cp -pv mpv/artifact/*.h "artifact-macos-${{ env.ARCH }}/" 2>/dev/null || true
          echo "=== contents ==="
          ls -l "artifact-macos-${{ env.ARCH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-natives-macos-${{ env.ARCH }}-mpv-${{ env.MPV_REF }}
          path: artifact-macos-${{ env.ARCH }}

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-${{ env.ARCH }}-${{ steps.get_time.outputs.timestamp }}